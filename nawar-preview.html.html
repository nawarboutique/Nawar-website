<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAWAR | Classic Dresses for Girls</title>
<meta name="description" content="Discover NAWAR, a Doha boutique for classic girls’ dresses. Our first collection is coming soon.">
<meta name="theme-color" content="#F2EDE3">
<style>
  :root {
    --ivory: #f2ede3;
    --pink: #e6c1be;
    --ink: #343629;
    --muted: #58564c;
    --line: #d5c9b8;
    --gold: #8a6940;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ivory); color: var(--ink); font-family: system-ui, sans-serif; }
  .wrap { width: min(100% - 4rem, 76rem); margin-inline: auto; }
  .masthead, .footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .65rem 1rem; }
  .masthead { padding-block: 1.15rem; border-bottom: 1px solid var(--line); }
  .eyebrow { font-size: .69rem; font-weight: 650; letter-spacing: .18em; text-transform: uppercase; }
  .masthead a, .footer a { color: inherit; text-underline-offset: .25em; }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: clamp(2rem, 6vw, 6rem); padding-block: clamp(1.75rem, 4vw, 3.6rem); }
  figure { margin: 0; }
  .portrait { width: 100%; height: clamp(27rem, 56vw, 39rem); object-fit: cover; object-position: center 57%; display: block; }
  .intro { width: 100%; max-width: 31rem; margin-inline: auto; text-align: center; }
  .logo { display: block; width: clamp(7rem, 16vw, 9.1rem); height: auto; margin: 0 auto 1.5rem; }
  .intro .eyebrow { color: var(--gold); }
  h1 { margin: .62rem 0 .85rem; font: 400 clamp(2.7rem, 5.3vw, 5.25rem)/.98 Georgia, serif; letter-spacing: -.055em; }
  .description { max-width: 28ch; margin: 0 auto; color: var(--muted); font: 400 clamp(1.18rem, 2vw, 1.45rem)/1.42 Georgia, serif; }
  .waitlist { margin-top: 1.65rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .waitlist label { display: block; margin-bottom: .8rem; color: var(--muted); font-size: .9rem; }
  .signup-row { display: flex; gap: .5rem; }
  input, button { min-height: 3rem; font: inherit; border-radius: 0; }
  input { flex: 1; width: 100%; min-width: 0; padding: .65rem .8rem; background: #fbf8f2; color: var(--ink); border: 1px solid #9d9081; }
  button { padding: .65rem 1rem; background: var(--pink); color: #332423; border: 1px solid transparent; cursor: pointer; white-space: nowrap; font-size: .88rem; font-weight: 650; }
  button:hover { background: #deb1ad; }
  :focus-visible { outline: 2px solid #614747; outline-offset: 3px; }
  .signup-provider { margin: .7rem 0 0; }
  .signup-provider img { display: block; width: 9rem; max-width: 100%; height: auto; margin-inline: auto; }
  .signup-trap { position: absolute; left: -5000px; }
  .footer { padding-block: 1rem 1.4rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .76rem; }
  @media (max-width: 860px) {
    .wrap { width: min(100% - 2.5rem, 42rem); }
    .hero { grid-template-columns: minmax(0, 1fr); gap: 1.75rem; }
    .portrait { height: clamp(15rem, 52vw, 24rem); object-position: center 60%; }
  }
  @media (max-width: 420px) {
    .signup-row { flex-direction: column; }
    .masthead { font-size: .8rem; }
  }
</style>
</head>
