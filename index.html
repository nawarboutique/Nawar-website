<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAWAR | Always in Bloom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FBF3EA;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .instagram-link {
      position: absolute;
      left: 43%;
      top: 75%;
      width: 14%;
      height: 11%;
      z-index: 10;
      cursor: pointer;
    }

    @media (orientation: portrait) {
  .hero img {
    object-fit: cover;
  }
}
  </style>
</head>

<body>

  <div class="hero">
    <img src="file12.png" alt="NAWAR - Always in Bloom">

    <a
      class="instagram-link"
      href="https://www.instagram.com/nawarboutiq/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="NAWAR Instagram">
    </a>
  </div>

</body>
</html>
