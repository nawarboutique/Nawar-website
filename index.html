<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAWAR | Always in Bloom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F4EA;
      color: #59624E;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .container {
      padding: 40px 24px;
    }

    .flower {
      font-size: 52px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 54px;
      letter-spacing: 8px;
      font-weight: 500;
    }

    .tagline {
      margin-top: 14px;
      font-size: 20px;
      font-style: italic;
    }

    .divider {
      width: 45px;
      height: 1px;
      background: #AAB59A;
      margin: 30px auto;
    }

    .description {
      font-family: Arial, sans-serif;
      font-size: 15px;
      letter-spacing: 1.5px;
      line-height: 1.8;
    }

    .coming {
      margin-top: 32px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="flower">🌼</div>

    <h1>NAWAR</h1>

    <div class="tagline">Always in Bloom</div>

    <div class="divider"></div>

    <div class="description">
      Children's Clothing<br>
      Doha, Qatar
    </div>

    <div class="coming">
      COMING SOON
    </div>

  </main>

</body>
</html>
